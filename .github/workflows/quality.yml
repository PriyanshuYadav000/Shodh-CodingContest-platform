name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # On trusted pushes to main, apply Ruff's mechanical fixes and commit
      # them. Pull requests are checked without write access or auto-commits.
      - name: Apply Ruff autofixes on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ruff check --fix src tests

      - name: Verify Ruff
        run: ruff check src tests

      - name: Commit Ruff autofixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: apply Ruff autofixes"
            git push
          fi

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run tests
        run: pytest -q
