name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shodh_test
          POSTGRES_USER: shodh_test
          POSTGRES_PASSWORD: shodh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shodh_test -d shodh_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://shodh_test:shodh_test@localhost:5432/shodh_test
      JWT_SECRET_KEY: ci-only-not-a-production-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check src tests

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
