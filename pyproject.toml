[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "shodh-coding-contest-platform"
version = "0.1.0"
description = "Backend for Shodh a Code coding contest platform"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends(...) and dependency factories as parameter defaults.
# This is the framework's standard dependency-injection pattern.
"src/shodh/routes/*.py" = ["B008"]
"src/shodh/dependencies/*.py" = ["B008"]
