[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "shodh-coding-contest-platform"
version = "0.1.0"
description = "Backend for Shodh a Code coding contest platform"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"